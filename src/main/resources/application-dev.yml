spring:
  datasource:
    url: jdbc:h2:mem:cuentas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  health:
    rabbit:
      enabled: false
    mail:
      enabled: false

cuentas:
  auth:
    google:
      mode: dev
